services:
  - type: web
    name: auditoria-upa
    runtime: node
    plan: starter
    buildCommand: npm ci && npm test && npm run check
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: audit-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_FILE
        value: /var/data/audit.sqlite
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
